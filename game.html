<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صدى الزمن | Echoes of Time</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --primary: #c5a059;
            --primary-glow: rgba(197, 160, 89, 0.4);
            --accent-blue: #45f3ff;
            --accent-green: #00ff88;
            --accent-red: #ff3344;
            --text: #ffffff;
            --panel-bg: rgba(26, 26, 36, 0.95);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
            background: radial-gradient(circle, #1a1a24 0%, #0b0c10 100%);
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .hidden { opacity: 0; visibility: hidden; pointer-events: none; z-index: -1 !important; }

        h1 {
            color: var(--primary);
            font-size: 2.8rem;
            text-shadow: 0 0 15px var(--primary-glow);
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle { color: #8f94a6; margin-bottom: 25px; font-style: italic; font-size: 1rem; }

        .menu-box {
            background: var(--panel-bg);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }

        .btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--text);
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--primary-glow);
            margin: 8px;
            min-width: 200px;
            display: inline-block;
        }

        .btn:hover, .btn:active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 25px var(--primary);
            transform: scale(1.03);
        }

        .lang-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.03);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .lang-mini-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e1;
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .lang-mini-btn.active {
            background: var(--primary);
            color: #000;
            font-weight: bold;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: 60px 1fr;
            position: relative;
        }

        header {
            background: #0f1015;
            border-bottom: 1px solid var(--primary-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 50;
        }

        .room-title { color: var(--primary); font-weight: bold; font-size: 1rem; text-shadow: 0 0 8px var(--primary-glow); }
        .top-icons { display: flex; gap: 8px; }
        .icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--primary-glow); color: var(--text); padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; }

        #stage {
            position: relative;
            background: #12131a;
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 12px;
            padding: 12px;
            height: 100%;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            #stage { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
        }

        .sidebar { display: flex; flex-direction: column; gap: 12px; }
        .panel { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; }
        .panel-title { color: var(--primary); font-size: 0.95rem; margin-bottom: 8px; font-weight: bold; }
        
        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .inv-slot { aspect-ratio: 1; background: rgba(255,255,255,0.02); border: 1px dashed #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #8f94a6; text-align: center; padding: 2px; cursor: pointer; }
        .inv-slot.active { border-color: var(--accent-blue); background: rgba(69,243,255,0.05); color: #fff; }

        .radar-text { font-size: 0.9rem; line-height: 1.5; color: #cbd5e1; }

        .puzzle-viewport {
            background: var(--panel-bg);
            border: 2px solid var(--primary-glow);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
            position: relative;
            min-height: 320px;
        }

        .room-desc { text-align: center; margin-bottom: 15px; }
        .room-desc h3 { color: #fff; font-size: 1.15rem; margin-bottom: 4px; }
        .room-desc p { color: #8f94a6; font-size: 0.85rem; }

        /* الغرفة 1: البيانو */
        .piano { display: flex; gap: 4px; background: #000; padding: 10px; border-radius: 8px; direction: ltr !important; }
        .key { width: 35px; height: 130px; background: white; border-radius: 0 0 4px 4px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; color: #000; padding-bottom: 8px; font-weight: bold; font-size: 0.9rem; transition: background 0.1s; }
        .key:active { background: #cbd5e1; transform: scaleY(0.97); transform-origin: top; }

        /* الغرفة 2: الساعات والتروس المتطورة بأسلوب الهاتف الخاص بك */
        .clock-work { position: relative; width: 200px; height: 200px; border: 8px double var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(20,20,30,0.8) 0%, rgba(0,0,0,0.6) 100%); box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: pointer; }
        .gear { border: 6px dashed var(--primary); border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; font-weight: bold; color: var(--primary); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .gear-small { width: 60px; height: 60px; top: 15px; left: 35px; border-color: var(--accent-blue); color: var(--accent-blue); }
        .gear-medium { width: 80px; height: 80px; bottom: 15px; left: 15px; border-color: var(--accent-green); color: var(--accent-green); }
        .gear-large { width: 100px; height: 100px; right: 15px; top: 40px; border-color: var(--primary); }

        /* الغرفة 3: الخيمياء */
        .beaker-container { display: flex; gap: 15px; }
        .beaker { width: 60px; height: 110px; border: 3px solid #ccc; border-top: none; border-radius: 0 0 12px 12px; position: relative; overflow: hidden; cursor: pointer; background: rgba(255,255,255,0.02); }
        .fluid { position: absolute; bottom: 0; width: 100%; transition: height 0.6s ease, background-color 0.4s; }

        /* الغرفة 4: الليزر والمرايا */
        .laser-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .mirror-node { width: 55px; height: 55px; border-radius: 50%; background: #1a1a24; border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; transition: transform 0.3s; color: #fff; }

        /* الغرفة 5: الفضاء والمدارات */
        .space-system { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; }
        .orbit { position: absolute; border: 1px dashed rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .planet { position: absolute; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; transition: all 0.3s; box-shadow: 0 0 8px currentColor; }

        /* الغرفة 6: صمامات البخار */
        .valve-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .valve { width: 80px; height: 80px; border: 4px double var(--primary); border-radius: 50%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.4s; background: #161622; font-weight: bold; font-size: 0.85rem; }
